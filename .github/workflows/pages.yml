name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a deploy still in flight.
concurrency: { group: pages, cancel-in-progress: true }

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # A project site lives under /<repo>/; the app reads the prefix back from BASE_URL.
      - run: pnpm build
        env: { BASE_PATH: "/${{ github.event.repository.name }}/" }
      # GitHub Pages has no rewrite rules. Serving index.html as the 404 page means a
      # refresh on /wooly/tracker still loads the app, and the router takes it from there.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
